# Copy to .github/workflows/qa-mobile-preview.yml in a mobile repository.
#
# Mobile runs are slower and less reliable than web runs on hosted runners, so the label
# gate is worth keeping longer here than on the web pipeline.

name: QA Mobile Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: qa-mobile-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  qa:
    if: contains(github.event.pull_request.labels.*.name, 'qa-preview')
    uses: bhaveshupadhyay/github_automation/.github/workflows/qa-mobile-preview.yml@main
    with:
      backend-repo: your-org/your-backend
      backend-default-branch: dev
      # 10.0.2.2 is the runner's localhost as seen from inside the Android emulator.
      api-base-url: http://10.0.2.2:8000
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BACKEND_TOKEN: ${{ secrets.BACKEND_TOKEN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      # Cloudflare R2 media storage. Optional: set these or keep the R2_* keys in
      # .env.qa.enc. A secret set here overrides the encrypted value.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
