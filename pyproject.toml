[project]
name = "github-automation-ai"
version = "0.1.2"
description = "Antigravity Autonomous Developer Workflow Engine for GitHub & Slack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Bhavesh Upadhyay" }
]
keywords = [
    "autopr",
    "github-automation",
    "slack",
    "gemini",
    "antigravity",
    "ai-developer"
]
dependencies = [
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
qa = [
    "playwright>=1.40.0",
    "boto3>=1.34.0",
]

[project.scripts]
autopr = "automation.main:main"
github-automation = "automation.main:main"
github-automation-ai = "automation.main:main"
qa-contract = "automation.qa_contract_cli:main"
secret-drift = "automation.secret_drift_cli:main"
qa-test-gen = "automation.qa_test_generator_cli:main"
qa-media = "automation.qa_media_processor_cli:main"
qa-publish = "automation.qa_publish_cli:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automation"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
