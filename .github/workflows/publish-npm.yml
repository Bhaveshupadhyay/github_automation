name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm-publish:
    name: Publish to npm (via OIDC Trusted Publishing)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to latest for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish to npm via OIDC Trusted Publishing
        run: npm publish --provenance --access public
