name: QA Mobile Preview

# Central pipeline for mobile pull requests opened in other repositories. It runs only
# when someone tags the Slack bot and asks for QA: the Cloudflare Worker sends a
# `qa_mobile_preview` repository dispatch here; this run boots the paired backend, builds
# the pull request's debug binary against it, records Maestro journeys on an emulator,
# and reports on the pull request and in the Slack thread that asked.
#
# The backend is reached at 10.0.2.2 rather than localhost, because inside an Android
# emulator localhost is the emulator itself.
#
# Mobile runs are slower and flakier than web runs on hosted runners (Appendix A.5). Ship
# the web pipeline first and treat this as an independent milestone.
#
# Which repositories are served, and which backend each pairs with, lives in
# contracts/qa-targets.json.
#
# Three jobs, so the pull request's own code never shares a runner with the credentials
# that can write to it: `resolve` reads the PR, `qa-preview` runs its code, and `publish`
# holds the token and storage keys on a fresh runner.

on:
  repository_dispatch:
    types: [qa_mobile_preview]
  # Manual re-run, e.g. after updating the backend branch or fixing a broken test.
  workflow_dispatch:
    inputs:
      repository:
        description: "Mobile repository as owner/name, registered in contracts/qa-targets.json."
        type: string
        required: true
      pr_number:
        description: "Pull request number."
        type: string
        required: true
      backend:
        description: "Backend: empty (resolve automatically), dev, main, main:owner/name, or owner/name#N."
        type: string
        required: false
        default: ""

# Keyed on the pull request, so a new push cancels the run still testing the old commit.
# `cancel-in-progress` is a capacity control, not a correctness guarantee: a run already
# past the cancellation point still finishes, which is why the publisher restores the
# single-comment invariant on its own (Directive 5.A.4).
concurrency:
  group: qa-mobile-preview-${{ github.event.client_payload.repository || inputs.repository }}-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PR_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
  # The Slack thread the request came from, so results are posted back into it. Empty on
  # a manual re-run.
  REQUEST_SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
  REQUEST_SLACK_THREAD: ${{ github.event.client_payload.slack_thread_ts }}
  # What the requester chose to test against: a backend PR, `main`, or the dev APIs.
  BACKEND_CHOICE: ${{ github.event.client_payload.backend || inputs.backend }}

jobs:
  # Reads the pull request fresh from the API and pairs it with its registered backend.
  # A PR that must not run — unregistered, closed, or from a fork — ends the run here.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      repository: ${{ steps.pr.outputs.repository }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      backend_repo: ${{ steps.pr.outputs.backend_repo }}
      backend_mode: ${{ steps.pr.outputs.backend_mode }}
      # A chosen backend PR or branch, else the branch resolved from the PR.
      backend_branch: ${{ steps.pr.outputs.backend_ref || steps.backend_branch.outputs.branch }}
      backend_label: ${{ steps.pr.outputs.backend_label }}
      dev_api_url: ${{ steps.pr.outputs.dev_api_url }}
      slack_channel: ${{ steps.pr.outputs.slack_channel }}
      db_strategy: ${{ steps.pr.outputs.db_strategy }}
      startup_timeout_seconds: ${{ steps.pr.outputs.startup_timeout_seconds }}
      python_version: ${{ steps.pr.outputs.python_version }}
      api_base_url: ${{ steps.pr.outputs.api_base_url }}
      android_api_level: ${{ steps.pr.outputs.android_api_level }}
      java_version: ${{ steps.pr.outputs.java_version }}
    steps:
      - name: Checkout QA tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          # Both values arrive from a dispatch payload or a manual input. They are read
          # from the environment, never interpolated, and validated before any use.
          REPO='[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
          if ! [[ "$PR_REPOSITORY" =~ ^${REPO}$ ]] || ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid dispatch: repository must be owner/name and pr_number a number."
            exit 1
          fi
          if ! [[ "$BACKEND_CHOICE" =~ ^(|dev|main|main:${REPO}|${REPO}#[0-9]+)$ ]]; then
            echo "::error::Invalid dispatch: backend must be empty, dev, main, main:owner/name or owner/name#N."
            exit 1
          fi
          mkdir -p qa-results
          uv run qa-pr-context \
            --repository "$PR_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --platform mobile \
            --backend "$BACKEND_CHOICE" \
            --branch-result-out qa-results/branch.json \
            --body-file qa-results/pr-body.txt

      - name: Explain why no preview was produced
        if: steps.pr.outputs.skip == 'true'
        env:
          REASON: ${{ steps.pr.outputs.skip_reason }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          echo "::notice::QA preview skipped: $REASON"
          echo "QA preview skipped: $REASON" >> "$GITHUB_STEP_SUMMARY"
          export SLACK_CHANNEL="$REQUEST_SLACK_CHANNEL" SLACK_THREAD="$REQUEST_SLACK_THREAD"
          export MESSAGE="⏭️ *QA testing skipped:* $REASON"
          python3 - <<'EOF'
          import json, os, urllib.request
          token, channel = os.getenv("SLACK_TOKEN"), os.getenv("SLACK_CHANNEL")
          if token and channel:
              payload = {"channel": channel, "text": os.environ["MESSAGE"]}
              if os.getenv("SLACK_THREAD"):
                  payload["thread_ts"] = os.environ["SLACK_THREAD"]
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
              )
              try:
                  urllib.request.urlopen(req, timeout=10).read()
              except Exception as e:
                  print(f"::warning::Slack notice not sent: {e}")
          EOF

      # Which backend branch belongs to this PR: explicit declaration, then a matching
      # remote head, then the registered default branch.
      - name: Resolve the backend branch
        id: backend_branch
        if: steps.pr.outputs.skip == 'false' && steps.pr.outputs.backend_mode == 'auto'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_BRANCH: ${{ steps.pr.outputs.head_ref }}
          BACKEND_REPO: ${{ steps.pr.outputs.backend_repo }}
          DEFAULT_BRANCH: ${{ steps.pr.outputs.backend_default_branch }}
        run: |
          set -euo pipefail
          uv run qa-branch-resolve \
            --source-branch "$SOURCE_BRANCH" \
            --backend-repo-url "https://github.com/${BACKEND_REPO}.git" \
            --pr-body-file qa-results/pr-body.txt \
            --default-branch "$DEFAULT_BRANCH" \
            --json > qa-results/branch.json
          BRANCH=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_branch"])' qa-results/branch.json)
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved backend branch: $BRANCH"

      - name: Keep the branch resolution for the report
        if: steps.pr.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: qa-context-${{ github.run_id }}
          path: qa-results/branch.json
          retention-days: 1
          if-no-files-found: ignore

      # An invalid dispatch, an API error or an expired token fails this job before the
      # skip decision exists, so neither later job runs. The requester still hears.
      - name: Tell the requester the run could not start
        if: failure()
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          export SLACK_CHANNEL="$REQUEST_SLACK_CHANNEL" SLACK_THREAD="$REQUEST_SLACK_THREAD"
          export MESSAGE="❌ *QA testing for ${PR_REPOSITORY}#${PR_NUMBER} could not start.* Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 - <<'EOF'
          import json, os, urllib.request
          token, channel = os.getenv("SLACK_TOKEN"), os.getenv("SLACK_CHANNEL")
          if token and channel:
              payload = {"channel": channel, "text": os.environ["MESSAGE"]}
              if os.getenv("SLACK_THREAD"):
                  payload["thread_ts"] = os.environ["SLACK_THREAD"]
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
              )
              try:
                  urllib.request.urlopen(req, timeout=10).read()
              except Exception as e:
                  print(f"::warning::Slack notice not sent: {e}")
          EOF

  # Runs the pull request's code. GitHub hands every secret a job references to its
  # runner, where that code has sudo, so this job references no token that can write to
  # the pull request and no storage credential: those belong to `publish`, on a separate
  # runner. Clones use a read-only token — QA_READ_TOKEN for private repositories, else
  # this run's own token, which can read public ones.
  qa-preview:
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MOBILE_DIR: ${{ github.workspace }}/mobile
      BACKEND_DIR: ${{ github.workspace }}/backend
      TOOLING_DIR: ${{ github.workspace }}/tooling
      RESULTS_DIR: ${{ github.workspace }}/qa-results
      MEDIA_DIR: ${{ github.workspace }}/qa-media
    steps:
      # Credentials are not persisted, so no token is left in .git/config for the PR's
      # code to read.
      - name: Checkout mobile app at the pull request head
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.head_sha }}
          token: ${{ secrets.QA_READ_TOKEN || github.token }}
          fetch-depth: 0
          persist-credentials: false
          path: mobile

      - name: Checkout QA tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: tooling

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "tooling/uv.lock"

      - name: Install QA tooling
        run: |
          set -euo pipefail
          uv sync --project "$TOOLING_DIR" --extra qa
          echo "Tooling at $(git -C "$TOOLING_DIR" rev-parse --short HEAD)"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.resolve.outputs.java_version }}

      - name: Set up Gradle with its cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install SOPS, age and FFmpeg
        run: |
          set -euo pipefail
          SOPS_VERSION=v3.9.4
          curl -fsSL -o /tmp/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          # FFmpeg compresses the recording and builds the preview GIF.
          sudo apt-get update -qq && sudo apt-get install -y -qq age ffmpeg
          sops --version
          ffmpeg -version | sed -n 1p

      # The mobile contract carries the platform, bundle ID and binary path. Reading them
      # here keeps the workflow free of per-repository hardcoding.
      - name: Read the mobile QA contract
        id: contract
        working-directory: mobile
        run: |
          set -euo pipefail
          # The schema travels with the tooling, so a repository cannot weaken validation
          # by shipping its own copy.
          uv run --project "$TOOLING_DIR" qa-contract qa-contract.json \
            --schema "$TOOLING_DIR/qa-contract.schema.json"
          BUNDLE_ID=$(python3 -c 'import json;print(json.load(open("qa-contract.json"))["mobileConfig"]["bundleId"])')
          BUILD_PATH=$(python3 -c 'import json;print(json.load(open("qa-contract.json"))["mobileConfig"]["buildOutputPath"])')
          API_ENV_VAR=$(python3 -c 'import json;print(json.load(open("qa-contract.json")).get("apiBaseUrlEnvVar",""))')
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "build_path=$BUILD_PATH" >> "$GITHUB_OUTPUT"
          echo "api_env_var=$API_ENV_VAR" >> "$GITHUB_OUTPUT"

      - name: Check mobile secret drift
        working-directory: mobile
        run: |
          if [ -f .env.example ]; then
            uv run --project "$TOOLING_DIR" secret-drift
          else
            echo "::notice::No .env.example in the mobile repository; drift check skipped."
          fi

      - name: Checkout backend at the resolved branch
        if: needs.resolve.outputs.backend_mode != 'dev'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.backend_repo }}
          ref: ${{ needs.resolve.outputs.backend_branch }}
          token: ${{ secrets.QA_READ_TOKEN || github.token }}
          persist-credentials: false
          path: backend

      - name: Check backend secret drift
        if: needs.resolve.outputs.backend_mode != 'dev'
        working-directory: backend
        run: |
          if [ -f .env.example ]; then
            uv run --project "$TOOLING_DIR" secret-drift
          else
            echo "::notice::No .env.example in the backend repository; drift check skipped."
          fi

      # Fail fast on a missing key or an undecryptable file, before minutes of
      #    startup. Nothing is exported: the supervisor decrypts for the services itself.
      - name: Decrypt the QA environment
        if: needs.resolve.outputs.backend_mode != 'dev'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SOPS_AGE_KEY:-}" ]; then
            echo "::error::SOPS_AGE_KEY is not set in github_automation's secrets."
            exit 1
          fi
          if [ ! -f backend/.env.qa.enc ]; then
            echo "::notice::No backend/.env.qa.enc; the backend starts without a decrypted environment."
            exit 0
          fi
          # The type is stated rather than inferred: SOPS cannot derive dotenv from the
          # .enc extension, and guesses YAML instead.
          sops --decrypt --input-type dotenv --output-type dotenv \
            backend/.env.qa.enc > /dev/null

      # Only the backend runs under the supervisor here; the app under test is a binary
      # installed on the emulator rather than a served process.
      - name: Start the backend and await health
        if: needs.resolve.outputs.backend_mode != 'dev'
        id: lifecycle
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DB_STRATEGY: ${{ needs.resolve.outputs.db_strategy }}
          STARTUP_TIMEOUT: ${{ needs.resolve.outputs.startup_timeout_seconds }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR"
          READY_FILE="$RUNNER_TEMP/qa-ready"
          rm -f "$READY_FILE"
          nohup uv run --project "$TOOLING_DIR" qa-lifecycle \
            --backend-dir "$BACKEND_DIR" \
            --db-strategy "$DB_STRATEGY" \
            --result-json "$RESULTS_DIR/lifecycle.json" \
            --ready-file "$READY_FILE" \
            --pid-file "$RUNNER_TEMP/supervisor.pid" \
            > "$RUNNER_TEMP/lifecycle.log" 2>&1 &
          LAUNCHER_PID=$!
          echo "$LAUNCHER_PID" > "$RUNNER_TEMP/launcher.pid"

          DEADLINE=$(( $(date +%s) + STARTUP_TIMEOUT ))
          while [ ! -f "$READY_FILE" ]; do
            if ! kill -0 "$LAUNCHER_PID" 2>/dev/null; then
              echo "::error::The lifecycle supervisor exited before the backend became healthy."
              tail -n 200 "$RUNNER_TEMP/lifecycle.log" || true
              exit 1
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::The backend did not become healthy within ${STARTUP_TIMEOUT}s."
              tail -n 200 "$RUNNER_TEMP/lifecycle.log" || true
              exit 1
            fi
            sleep 2
          done
          echo "✅ Backend healthy."

      - name: Build the debug binary against the runner backend
        working-directory: mobile
        env:
          API_BASE_URL: ${{ needs.resolve.outputs.backend_mode == 'dev' && needs.resolve.outputs.dev_api_url || needs.resolve.outputs.api_base_url }}
          API_ENV_VAR: ${{ steps.contract.outputs.api_env_var }}
        run: |
          set -euo pipefail
          # The contract names the variable; the workflow supplies the value. Neither side
          # hardcodes the other's convention.
          if [ -n "$API_ENV_VAR" ]; then
            export "$API_ENV_VAR=$API_BASE_URL"
            echo "Building with $API_ENV_VAR=$API_BASE_URL"
          else
            echo "::warning::The contract declares no apiBaseUrlEnvVar; the build will use its own default backend address."
          fi
          PREPARE=$(python3 -c 'import json;c=json.load(open("qa-contract.json"));print((c.get("lifecycle") or {}).get("prepare") or c.get("prepare") or "")')
          if [ -z "$PREPARE" ]; then
            echo "::error::The mobile contract declares no prepare hook, so there is no way to build the binary."
            exit 1
          fi
          bash -c "$PREPARE"

      - name: Restore the test plan cache
        uses: actions/cache@v4
        with:
          path: mobile/.qa-cache/test-plans
          key: qa-mobile-plan-${{ needs.resolve.outputs.repository }}-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.head_sha }}
          restore-keys: |
            qa-mobile-plan-${{ needs.resolve.outputs.repository }}-${{ needs.resolve.outputs.pr_number }}-
            qa-mobile-plan-${{ needs.resolve.outputs.repository }}-

      - name: Generate the test plan from the diff
        working-directory: mobile
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" > /dev/null; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          uv run --project "$TOOLING_DIR" qa-test-gen \
            --commit-sha "$HEAD_SHA" \
            --base-branch "origin/$BASE_REF" \
            --output "$RESULTS_DIR/plan.json"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for a hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator action owns the device lifecycle, so the journeys run inside its
      # script rather than as sibling steps.
      - name: Execute the flows on an emulator
        id: tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          BUNDLE_ID: ${{ steps.contract.outputs.bundle_id }}
          BUILD_PATH: ${{ steps.contract.outputs.build_path }}
          API_BASE_URL: ${{ needs.resolve.outputs.backend_mode == 'dev' && needs.resolve.outputs.dev_api_url || needs.resolve.outputs.api_base_url }}
        with:
          api-level: ${{ needs.resolve.outputs.android_api_level }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "$MOBILE_DIR/$BUILD_PATH"
            uv run --project "$TOOLING_DIR" qa-run \
              --plan "$RESULTS_DIR/plan.json" \
              --runner maestro \
              --app-id "$BUNDLE_ID" \
              --base-url "$API_BASE_URL" \
              --video-dir "$MEDIA_DIR/raw" \
              --result-json "$RESULTS_DIR/run.json" \
              --selected-video-out "$RESULTS_DIR/selected-video.txt"

      - name: Compress the recording and build the preview GIF
        id: media
        if: always()
        run: |
          set -euo pipefail
          # Read the runner's own selection rather than globbing the directory. On a
          # multi-journey run a glob returns whichever file the filesystem lists first,
          # which is usually a passing journey's recording instead of the failing one.
          VIDEO=""
          if [ -f "$RESULTS_DIR/selected-video.txt" ]; then
            VIDEO=$(head -n 1 "$RESULTS_DIR/selected-video.txt")
          fi
          if [ -n "$VIDEO" ] && [ ! -f "$VIDEO" ]; then
            echo "::warning::The selected recording is missing: $VIDEO"
            VIDEO=""
          fi
          if [ -z "$VIDEO" ]; then
            echo "::notice::No recording was produced; publishing results without media."
            exit 0
          fi
          uv run --project "$TOOLING_DIR" qa-media \
            --input "$VIDEO" \
            --output-dir "$MEDIA_DIR/processed" \
            --result-json "$RESULTS_DIR/media.json"

      # Hands the results to `publish`. Paths inside the result files are absolute, and
      # every job of this repository shares the same workspace path, so they resolve
      # unchanged on the publishing runner.
      - name: Hand the results to the publisher
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-output-${{ github.run_id }}
          path: |
            qa-results
            qa-media
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics-${{ github.run_id }}
          path: |
            qa-results
            ${{ runner.temp }}/lifecycle.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the backend
        if: always()
        run: |
          for PID_FILE in "$RUNNER_TEMP/supervisor.pid" "$RUNNER_TEMP/launcher.pid"; do
            [ -f "$PID_FILE" ] || continue
            kill -TERM "$(cat "$PID_FILE")" 2>/dev/null || true
          done
          rm -f "$RUNNER_TEMP/qa.env"
          sleep 2

      - name: Report the test outcome
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::QA flows failed. The recording and diagnostics are in the pull request comment."
            exit 1
          fi
          echo "✅ All QA flows passed."

  # Uploads the media and comments on the pull request. Runs none of the pull request's
  # code, so the write token and the storage credentials never share its runner.
  publish:
    needs: [resolve, qa-preview]
    # Runs after a failed preview, but not after a cancelled one: a newer request
    # superseded it, and its "stopped early" notice would contradict the live run.
    if: ${{ !cancelled() && needs.resolve.outputs.skip == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOOLING_DIR: ${{ github.workspace }}/tooling
      RESULTS_DIR: ${{ github.workspace }}/qa-results
    steps:
      - name: Checkout QA tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: tooling

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "tooling/uv.lock"

      - name: Install QA tooling
        run: uv sync --project "$TOOLING_DIR" --extra qa

      - name: Collect the test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-output-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: Collect the branch resolution
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-context-${{ github.run_id }}
          path: qa-results

      # The run stopped before any test executed — checkout, startup or plan generation.
      # The requester still hears about it in the thread that asked.
      - name: Tell the requester the run stopped early
        if: hashFiles('qa-results/run.json') == ''
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel || needs.resolve.outputs.slack_channel }}
          SLACK_THREAD: ${{ github.event.client_payload.slack_thread_ts }}
          TARGET_REPO: ${{ needs.resolve.outputs.repository }}
          TARGET_PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          export MESSAGE="❌ *QA testing for ${TARGET_REPO}#${TARGET_PR} stopped before any test ran.* Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 - <<'EOF'
          import json, os, urllib.request
          token, channel = os.getenv("SLACK_TOKEN"), os.getenv("SLACK_CHANNEL")
          if token and channel:
              payload = {"channel": channel, "text": os.environ["MESSAGE"]}
              if os.getenv("SLACK_THREAD"):
                  payload["thread_ts"] = os.environ["SLACK_THREAD"]
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
              )
              try:
                  urllib.request.urlopen(req, timeout=10).read()
              except Exception as e:
                  print(f"::warning::Slack notice not sent: {e}")
          EOF

      - name: Publish the QA comment
        id: qa_publish
        env:
          # A token that can comment on the repository under test. This run's own
          # GITHUB_TOKEN is scoped to github_automation and cannot.
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel || needs.resolve.outputs.slack_channel }}
          SLACK_THREAD: ${{ github.event.client_payload.slack_thread_ts }}
          QA_ARTIFACT_DIR: ${{ github.workspace }}/qa-artifacts
          TARGET_REPO: ${{ needs.resolve.outputs.repository }}
          TARGET_PR: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ ! -f "$RESULTS_DIR/run.json" ]; then
            echo "::warning::No test result was written; nothing to publish."
            exit 0
          fi
          # An unset secret or output arrives as an empty string, which the storage and
          # Slack configuration would read as a value rather than as absent.
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL SLACK_CHANNEL SLACK_THREAD; do
            [ -n "${!key:-}" ] || unset "$key"
          done
          uv run --project "$TOOLING_DIR" qa-publish \
            --repo "$TARGET_REPO" \
            --pr "$TARGET_PR" \
            --sha "$HEAD_SHA" \
            --test-result "$RESULTS_DIR/run.json" \
            --media-result "$RESULTS_DIR/media.json" \
            --branch-result "$RESULTS_DIR/branch.json" \
            --run-url "$RUN_URL"

      # Collects whatever the publisher staged when R2 was unavailable. Python cannot
      # upload a workflow artifact itself, so this step completes that fallback.
      - name: Upload QA media (storage fallback)
        if: always() && hashFiles('qa-artifacts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qa-media-${{ needs.resolve.outputs.head_sha }}
          path: qa-artifacts
          retention-days: 30
          if-no-files-found: ignore
