name: Run AGY CLI Task

on:
  workflow_dispatch:

jobs:
  run-agy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Restore OAuth Token File
        env:
          AGY_SESSION_DATA: ${{ secrets.AGY_SESSION_DATA }}
        run: |
          if [ -n "$AGY_SESSION_DATA" ]; then
            mkdir -p ~/.gemini/antigravity-cli
            echo "$AGY_SESSION_DATA" | tr -d '\r\n ' | base64 -d > ~/.gemini/antigravity-cli/antigravity-oauth-token || true
          fi

      - name: Execute AGY CLI
        run: |
          agy --print "Review code and suggest improvements" \
            --dangerously-skip-permissions