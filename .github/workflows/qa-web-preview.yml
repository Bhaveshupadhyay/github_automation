name: QA Web Preview

# Central pipeline: QA-tests a pull request opened in another repository, from this one.
# It runs only when someone tags the Slack bot and asks for it: the Cloudflare Worker
# classifies the request as QA_TESTING and sends a `qa_web_preview` repository dispatch
# here. This run clones the pull request's branch and its paired backend, records the
# journeys Gemini derived from the diff, uploads the media to R2, comments on the pull
# request and replies in the Slack thread that asked. The repositories under test hold no
# workflow and no secret.
#
# Which repositories are served, and which backend each pairs with, lives in
# contracts/qa-targets.json.
#
# Three jobs, so the pull request's own code never shares a runner with the credentials
# that can write to it: `resolve` reads the PR, `qa-preview` runs its code, and `publish`
# holds the token and storage keys on a fresh runner.

on:
  repository_dispatch:
    types: [qa_web_preview]
  # Manual re-run, e.g. after updating the backend branch or fixing a broken test.
  workflow_dispatch:
    inputs:
      repository:
        description: "Frontend repository as owner/name, registered in contracts/qa-targets.json."
        type: string
        required: true
      pr_number:
        description: "Pull request number."
        type: string
        required: true

# Keyed on the pull request, so a new push cancels the run still testing the old commit.
# `cancel-in-progress` is a capacity control, not a correctness guarantee: a run already
# past the cancellation point still finishes, which is why the publisher restores the
# single-comment invariant on its own (Directive 5.A.4).
concurrency:
  group: qa-web-preview-${{ github.event.client_payload.repository || inputs.repository }}-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PR_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
  # The Slack thread the request came from, so results are posted back into it. Empty on
  # a manual re-run.
  REQUEST_SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel }}
  REQUEST_SLACK_THREAD: ${{ github.event.client_payload.slack_thread_ts }}

jobs:
  # Reads the pull request fresh from the API and pairs it with its registered backend.
  # A PR that must not run — unregistered, closed, or from a fork — ends the run here.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
      repository: ${{ steps.pr.outputs.repository }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
      backend_repo: ${{ steps.pr.outputs.backend_repo }}
      backend_branch: ${{ steps.backend_branch.outputs.branch }}
      slack_channel: ${{ steps.pr.outputs.slack_channel }}
      db_strategy: ${{ steps.pr.outputs.db_strategy }}
      startup_timeout_seconds: ${{ steps.pr.outputs.startup_timeout_seconds }}
      python_version: ${{ steps.pr.outputs.python_version }}
      frontend_url: ${{ steps.pr.outputs.frontend_url }}
      node_version: ${{ steps.pr.outputs.node_version }}
    steps:
      - name: Checkout QA tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -euo pipefail
          # Both values arrive from a dispatch payload or a manual input. They are read
          # from the environment, never interpolated, and validated before any use.
          if ! [[ "$PR_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid dispatch: repository must be owner/name and pr_number a number."
            exit 1
          fi
          mkdir -p qa-results
          uv run qa-pr-context \
            --repository "$PR_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --platform web \
            --body-file qa-results/pr-body.txt

      - name: Explain why no preview was produced
        if: steps.pr.outputs.skip == 'true'
        env:
          REASON: ${{ steps.pr.outputs.skip_reason }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          echo "::notice::QA preview skipped: $REASON"
          echo "QA preview skipped: $REASON" >> "$GITHUB_STEP_SUMMARY"
          export SLACK_CHANNEL="$REQUEST_SLACK_CHANNEL" SLACK_THREAD="$REQUEST_SLACK_THREAD"
          export MESSAGE="⏭️ *QA testing skipped:* $REASON"
          python3 - <<'EOF'
          import json, os, urllib.request
          token, channel = os.getenv("SLACK_TOKEN"), os.getenv("SLACK_CHANNEL")
          if token and channel:
              payload = {"channel": channel, "text": os.environ["MESSAGE"]}
              if os.getenv("SLACK_THREAD"):
                  payload["thread_ts"] = os.environ["SLACK_THREAD"]
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
              )
              try:
                  urllib.request.urlopen(req, timeout=10).read()
              except Exception as e:
                  print(f"::warning::Slack notice not sent: {e}")
          EOF

      # Which backend branch belongs to this PR: explicit declaration, then a matching
      # remote head, then the registered default branch.
      - name: Resolve the backend branch
        id: backend_branch
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SOURCE_BRANCH: ${{ steps.pr.outputs.head_ref }}
          BACKEND_REPO: ${{ steps.pr.outputs.backend_repo }}
          DEFAULT_BRANCH: ${{ steps.pr.outputs.backend_default_branch }}
        run: |
          set -euo pipefail
          uv run qa-branch-resolve \
            --source-branch "$SOURCE_BRANCH" \
            --backend-repo-url "https://github.com/${BACKEND_REPO}.git" \
            --pr-body-file qa-results/pr-body.txt \
            --default-branch "$DEFAULT_BRANCH" \
            --json > qa-results/branch.json
          BRANCH=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_branch"])' qa-results/branch.json)
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved backend branch: $BRANCH"

      - name: Keep the branch resolution for the report
        if: steps.pr.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: qa-context-${{ github.run_id }}
          path: qa-results/branch.json
          retention-days: 1

  # Runs the pull request's code. Holds no token that can write to the pull request and
  # no storage credential: those belong to `publish`, on a separate runner.
  qa-preview:
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRONTEND_DIR: ${{ github.workspace }}/frontend
      BACKEND_DIR: ${{ github.workspace }}/backend
      TOOLING_DIR: ${{ github.workspace }}/tooling
      RESULTS_DIR: ${{ github.workspace }}/qa-results
      MEDIA_DIR: ${{ github.workspace }}/qa-media
      QA_BASE_URL: ${{ needs.resolve.outputs.frontend_url }}
    steps:
      # 1. Frontend, at the PR head. `fetch-depth: 0` is required: the diff that drives
      #    test generation is computed against the base branch. Credentials are not
      #    persisted, so no token is left in .git/config for the PR's code to read.
      - name: Checkout frontend at the pull request head
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.head_sha }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: frontend

      - name: Checkout QA tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: tooling

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "tooling/uv.lock"

      - name: Install QA tooling
        run: |
          set -euo pipefail
          uv sync --project "$TOOLING_DIR" --extra qa
          echo "Tooling at $(git -C "$TOOLING_DIR" rev-parse --short HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install SOPS and age
        run: |
          set -euo pipefail
          SOPS_VERSION=v3.9.4
          curl -fsSL -o /tmp/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          sops --version

      # 2. Fail here, before anything is started, when the PR adds a variable to
      #    .env.example without adding it to .env.qa.enc. The alternative is a service
      #    that starts, misbehaves, and fails an unrelated assertion minutes later.
      - name: Check frontend secret drift
        working-directory: frontend
        run: |
          if [ -f .env.example ]; then
            uv run --project "$TOOLING_DIR" secret-drift
          else
            echo "::notice::No .env.example in the frontend repository; drift check skipped."
          fi

      - name: Checkout backend at the resolved branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.backend_repo }}
          ref: ${{ needs.resolve.outputs.backend_branch }}
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          path: backend

      - name: Check backend secret drift
        working-directory: backend
        run: |
          if [ -f .env.example ]; then
            uv run --project "$TOOLING_DIR" secret-drift
          else
            echo "::notice::No .env.example in the backend repository; drift check skipped."
          fi

      # 3. Fail fast on a missing key or an undecryptable file, before minutes of
      #    startup. Nothing is exported: the supervisor decrypts for the services itself.
      - name: Decrypt the QA environment
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SOPS_AGE_KEY:-}" ]; then
            echo "::error::SOPS_AGE_KEY is not set in github_automation's secrets."
            exit 1
          fi
          if [ ! -f backend/.env.qa.enc ]; then
            echo "::notice::No backend/.env.qa.enc; the backend starts without a decrypted environment."
            exit 0
          fi
          # The type is stated rather than inferred: SOPS cannot derive dotenv from the
          # .enc extension, and guesses YAML instead.
          sops --decrypt --input-type dotenv --output-type dotenv \
            backend/.env.qa.enc > /dev/null

      # 4. Database provisioning, both services, and the health probes. Backgrounded so
      #    the services outlive this step; readiness is a file the supervisor writes only
      #    after both probes return 200, not a guessed sleep.
      - name: Start services and await health
        id: lifecycle
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          DB_STRATEGY: ${{ needs.resolve.outputs.db_strategy }}
          STARTUP_TIMEOUT: ${{ needs.resolve.outputs.startup_timeout_seconds }}
        run: |
          set -euo pipefail
          mkdir -p "$RESULTS_DIR"
          READY_FILE="$RUNNER_TEMP/qa-ready"
          rm -f "$READY_FILE"
          nohup uv run --project "$TOOLING_DIR" qa-lifecycle \
            --backend-dir "$BACKEND_DIR" \
            --frontend-dir "$FRONTEND_DIR" \
            --db-strategy "$DB_STRATEGY" \
            --result-json "$RESULTS_DIR/lifecycle.json" \
            --ready-file "$READY_FILE" \
            --pid-file "$RUNNER_TEMP/supervisor.pid" \
            > "$RUNNER_TEMP/lifecycle.log" 2>&1 &
          LAUNCHER_PID=$!
          echo "$LAUNCHER_PID" > "$RUNNER_TEMP/launcher.pid"
          echo "launcher_pid=$LAUNCHER_PID" >> "$GITHUB_OUTPUT"

          DEADLINE=$(( $(date +%s) + STARTUP_TIMEOUT ))
          while [ ! -f "$READY_FILE" ]; do
            if ! kill -0 "$LAUNCHER_PID" 2>/dev/null; then
              echo "::error::The lifecycle supervisor exited before the services became healthy."
              tail -n 200 "$RUNNER_TEMP/lifecycle.log" || true
              exit 1
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Services did not become healthy within ${STARTUP_TIMEOUT}s."
              tail -n 200 "$RUNNER_TEMP/lifecycle.log" || true
              exit 1
            fi
            sleep 2
          done
          echo "✅ Services healthy."
          tail -n 40 "$RUNNER_TEMP/lifecycle.log" || true

      # 5. The plan is cached by diff content, so re-running an unchanged commit reuses it
      #    and makes no model call. Keys carry the repository: this cache is shared by
      #    every repository the pipeline serves.
      - name: Restore the test plan cache
        uses: actions/cache@v4
        with:
          path: frontend/.qa-cache/test-plans
          key: qa-test-plan-${{ needs.resolve.outputs.repository }}-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.head_sha }}
          restore-keys: |
            qa-test-plan-${{ needs.resolve.outputs.repository }}-${{ needs.resolve.outputs.pr_number }}-
            qa-test-plan-${{ needs.resolve.outputs.repository }}-

      - name: Generate the test plan from the diff
        working-directory: frontend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          # `fetch-depth: 0` already fetched every branch; the explicit fetch only covers
          # a base branch that is somehow missing, and needs no credentials for a public
          # repository.
          if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" > /dev/null; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fi
          uv run --project "$TOOLING_DIR" qa-test-gen \
            --commit-sha "$HEAD_SHA" \
            --base-branch "origin/$BASE_REF" \
            --output "$RESULTS_DIR/plan.json"

      - name: Cache Playwright browsers
        id: playwright_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tooling/uv.lock') }}

      - name: Install Playwright Chromium
        run: uv run --project "$TOOLING_DIR" playwright install --with-deps chromium

      # 6. Execute. The step is allowed to fail so the recording of the failure is still
      #    processed and published; the job is failed at the end instead.
      - name: Execute the test plan
        id: tests
        continue-on-error: true
        run: |
          uv run --project "$TOOLING_DIR" qa-run \
            --plan "$RESULTS_DIR/plan.json" \
            --runner playwright \
            --base-url "$QA_BASE_URL" \
            --video-dir "$MEDIA_DIR/raw" \
            --result-json "$RESULTS_DIR/run.json" \
            --selected-video-out "$RESULTS_DIR/selected-video.txt"

      - name: Compress the recording and build the preview GIF
        id: media
        if: always()
        run: |
          set -euo pipefail
          # The runner owns the selection rule — a failed journey's recording first. Both
          # pipelines read it from the same file, so neither re-derives it by globbing.
          VIDEO=""
          if [ -f "$RESULTS_DIR/selected-video.txt" ]; then
            VIDEO=$(head -n 1 "$RESULTS_DIR/selected-video.txt")
          fi
          if [ -z "$VIDEO" ] || [ ! -f "$VIDEO" ]; then
            echo "::notice::No recording was produced; publishing results without media."
            exit 0
          fi
          uv run --project "$TOOLING_DIR" qa-media \
            --input "$VIDEO" \
            --output-dir "$MEDIA_DIR/processed" \
            --result-json "$RESULTS_DIR/media.json"

      # Hands the results to `publish`. Paths inside the result files are absolute, and
      # every job of this repository shares the same workspace path, so they resolve
      # unchanged on the publishing runner.
      - name: Hand the results to the publisher
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-output-${{ github.run_id }}
          path: |
            qa-results
            qa-media
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-diagnostics-${{ github.run_id }}
          path: |
            qa-results
            ${{ runner.temp }}/lifecycle.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the services
        if: always()
        run: |
          for PID_FILE in "$RUNNER_TEMP/supervisor.pid" "$RUNNER_TEMP/launcher.pid"; do
            [ -f "$PID_FILE" ] || continue
            PID=$(cat "$PID_FILE")
            # SIGTERM reaches the supervisor's handler, which terminates the service tree
            # and shreds the decrypted environment file.
            kill -TERM "$PID" 2>/dev/null || true
          done
          rm -f "$RUNNER_TEMP/qa.env"
          sleep 2

      # The publishing job runs on failure by design, so this job's own verdict is
      # asserted last rather than inherited from the test step.
      - name: Report the test outcome
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::QA journeys failed. The recording and diagnostics are in the pull request comment."
            exit 1
          fi
          echo "✅ All QA journeys passed."

  # Uploads the media and comments on the pull request. Runs none of the pull request's
  # code, so the write token and the storage credentials never share its runner.
  publish:
    needs: [resolve, qa-preview]
    if: always() && needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOOLING_DIR: ${{ github.workspace }}/tooling
      RESULTS_DIR: ${{ github.workspace }}/qa-results
    steps:
      - name: Checkout QA tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: tooling

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "tooling/uv.lock"

      - name: Install QA tooling
        run: uv sync --project "$TOOLING_DIR" --extra qa

      - name: Collect the test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-output-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: Collect the branch resolution
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-context-${{ github.run_id }}
          path: qa-results

      # The run stopped before any test executed — checkout, startup or plan generation.
      # The requester still hears about it in the thread that asked.
      - name: Tell the requester the run stopped early
        if: hashFiles('qa-results/run.json') == ''
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel || needs.resolve.outputs.slack_channel }}
          SLACK_THREAD: ${{ github.event.client_payload.slack_thread_ts }}
          TARGET_REPO: ${{ needs.resolve.outputs.repository }}
          TARGET_PR: ${{ needs.resolve.outputs.pr_number }}
        run: |
          export MESSAGE="❌ *QA testing for ${TARGET_REPO}#${TARGET_PR} stopped before any test ran.* Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 - <<'EOF'
          import json, os, urllib.request
          token, channel = os.getenv("SLACK_TOKEN"), os.getenv("SLACK_CHANNEL")
          if token and channel:
              payload = {"channel": channel, "text": os.environ["MESSAGE"]}
              if os.getenv("SLACK_THREAD"):
                  payload["thread_ts"] = os.environ["SLACK_THREAD"]
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json; charset=utf-8"},
              )
              try:
                  urllib.request.urlopen(req, timeout=10).read()
              except Exception as e:
                  print(f"::warning::Slack notice not sent: {e}")
          EOF

      - name: Publish the QA comment
        id: qa_publish
        env:
          # A token that can comment on the repository under test. This run's own
          # GITHUB_TOKEN is scoped to github_automation and cannot.
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.client_payload.slack_channel || needs.resolve.outputs.slack_channel }}
          SLACK_THREAD: ${{ github.event.client_payload.slack_thread_ts }}
          QA_ARTIFACT_DIR: ${{ github.workspace }}/qa-artifacts
          TARGET_REPO: ${{ needs.resolve.outputs.repository }}
          TARGET_PR: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ ! -f "$RESULTS_DIR/run.json" ]; then
            echo "::warning::No test result was written; nothing to publish."
            exit 0
          fi
          # An unset secret or output arrives as an empty string, which the storage and
          # Slack configuration would read as a value rather than as absent.
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL SLACK_CHANNEL SLACK_THREAD; do
            [ -n "${!key:-}" ] || unset "$key"
          done
          uv run --project "$TOOLING_DIR" qa-publish \
            --repo "$TARGET_REPO" \
            --pr "$TARGET_PR" \
            --sha "$HEAD_SHA" \
            --test-result "$RESULTS_DIR/run.json" \
            --media-result "$RESULTS_DIR/media.json" \
            --branch-result "$RESULTS_DIR/branch.json" \
            --run-url "$RUN_URL"

      # Collects whatever the publisher staged when R2 was unavailable. Python cannot
      # upload a workflow artifact itself, so this step completes that fallback.
      - name: Upload QA media (storage fallback)
        if: always() && hashFiles('qa-artifacts/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: qa-media-${{ needs.resolve.outputs.head_sha }}
          path: qa-artifacts
          retention-days: 30
          if-no-files-found: ignore
