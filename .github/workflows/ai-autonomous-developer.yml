name: Antigravity Autonomous Developer (AGY Engine)

on:
  repository_dispatch:
    types: [ai_developer_task]
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target Repository (owner/repo)"
        required: false
      user_prompt:
        description: "User Prompt"
        required: false
      model:
        description: "AI Model (e.g. gemini-3.5-flash-lite, gemini-3.6-flash)"
        required: false
        default: "gemini-3.5-flash-lite"
      effort:
        description: "Reasoning Effort (high, medium, low)"
        required: false
        default: "high"
      slack_channel:
        description: "Slack Channel ID"
        required: false
      slack_thread_ts:
        description: "Slack Thread Timestamp"
        required: false

jobs:
  run-agy-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Setup Python & Install Graphify AST Indexer
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify & CLI Tools
        run: |
          pip install graphify-cli || true

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Restore Antigravity Auth & Session Config
        env:
          AGY_AUTH_CONFIG: ${{ secrets.AGY_AUTH_CONFIG }}
          AGY_SESSION_DATA: ${{ secrets.AGY_SESSION_DATA }}
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.gemini/config
          if [ -n "$AGY_SESSION_DATA" ]; then
            echo "$AGY_SESSION_DATA" | tr -d '\r\n ' | base64 -d > ~/.gemini/antigravity-cli/antigravity-oauth-token || true
          fi
          if [ -n "$AGY_AUTH_CONFIG" ]; then
            echo "$AGY_AUTH_CONFIG" | tr -d '\r\n ' | base64 -d > ~/.gemini/oauth_creds.json || true
          fi

      - name: Extract Target Repo, Prompt, Model, Effort & Slack Identifiers
        id: extract_vars
        run: |
          TARGET="${{ github.event.inputs.target_repo }}"
          PROMPT="${{ github.event.inputs.user_prompt }}"
          MODEL_NAME="${{ github.event.inputs.model }}"
          EFFORT_VAL="${{ github.event.inputs.effort }}"
          SLACK_CHAN="${{ github.event.inputs.slack_channel }}"
          SLACK_THREAD="${{ github.event.inputs.slack_thread_ts }}"
          
          if [ -z "$TARGET" ]; then
            TARGET="${{ github.event.client_payload.target_repo }}"
          fi
          if [ -z "$PROMPT" ]; then
            PROMPT="${{ github.event.client_payload.user_prompt }}"
          fi
          if [ -z "$MODEL_NAME" ]; then
            MODEL_NAME="${{ github.event.client_payload.model }}"
          fi
          if [ -z "$MODEL_NAME" ]; then
            MODEL_NAME="gemini-3.5-flash-lite"
          fi
          if [ -z "$EFFORT_VAL" ]; then
            EFFORT_VAL="${{ github.event.client_payload.effort }}"
          fi
          if [ -z "$EFFORT_VAL" ]; then
            EFFORT_VAL="high"
          fi
          if [ -z "$SLACK_CHAN" ]; then
            SLACK_CHAN="${{ github.event.client_payload.slack_channel }}"
          fi
          if [ -z "$SLACK_THREAD" ]; then
            SLACK_THREAD="${{ github.event.client_payload.slack_thread_ts }}"
          fi

          echo "target_repo=$TARGET" >> $GITHUB_OUTPUT
          echo "user_prompt=$PROMPT" >> $GITHUB_OUTPUT
          echo "model=$MODEL_NAME" >> $GITHUB_OUTPUT
          echo "effort=$EFFORT_VAL" >> $GITHUB_OUTPUT
          echo "slack_channel=$SLACK_CHAN" >> $GITHUB_OUTPUT
          echo "slack_thread_ts=$SLACK_THREAD" >> $GITHUB_OUTPUT

      - name: Clone Target Repository Workspace
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TARGET_REPO="${{ steps.extract_vars.outputs.target_repo }}"
          echo "Cloning $TARGET_REPO..."
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git workspace_target

      - name: Copy Antigravity Rules & Build Graphify AST Graph
        run: |
          mkdir -p workspace_target/.agents/rules
          cp -r .agents/rules/* workspace_target/.agents/rules/ 2>/dev/null || true
          
          cd workspace_target
          if [ ! -d "graphify-out" ]; then
            echo "📊 Building Graphify AST Knowledge Graph on runner VM..."
            graphify update . || true
          fi

      - name: Run Antigravity Autonomous Agent Engine (Live Streamed Logs)
        id: run_agy
        working-directory: workspace_target
        run: |
          PROMPT="${{ steps.extract_vars.outputs.user_prompt }}"
          EFFORT_VAL="${{ steps.extract_vars.outputs.effort }}"
          echo "=========================================================================="
          echo "🤖 EXECUTING GOOGLE ANTIGRAVITY CLI (agy) | EFFORT: $EFFORT_VAL"
          echo "=========================================================================="
          
          agy --print "$PROMPT" \
            --dangerously-skip-permissions \
            --effort "$EFFORT_VAL" 2>&1 | tee ../agy_execution.log || true

      - name: Handle Clarification Requests (Interactive Loop)
        working-directory: workspace_target
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ steps.extract_vars.outputs.slack_channel }}
          SLACK_THREAD: ${{ steps.extract_vars.outputs.slack_thread_ts }}
        run: |
          if grep -q "CLARIFICATION_NEEDED:" ../agy_execution.log; then
            QUESTION=$(grep "CLARIFICATION_NEEDED:" ../agy_execution.log | head -n 1 | sed 's/CLARIFICATION_NEEDED://')
            echo "Clarification requested by AI: $QUESTION"
            
            if [ -n "$SLACK_TOKEN" ] && [ -n "$SLACK_CHANNEL" ]; then
              curl -s -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer ${SLACK_TOKEN}" \
                -H "Content-Type: application/json" \
                -d json_payload=$(jq -n \
                  --arg chan "$SLACK_CHANNEL" \
                  --arg thread "$SLACK_THREAD" \
                  --arg question "$QUESTION" \
                  '{channel: $chan, thread_ts: $thread, text: ("❓ *Clarification Needed by Antigravity AI:*\n\n" + $question + "\n\n💬 *Please reply in this thread with the requested detail!*")}')
            fi
            echo "CLARIFICATION_EXIT=true" >> $GITHUB_ENV
          fi

      - name: Clean Up Rules/Skills & Push Git Branch (Open PR)
        if: env.CLARIFICATION_EXIT != 'true'
        working-directory: workspace_target
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ steps.extract_vars.outputs.slack_channel }}
          SLACK_THREAD: ${{ steps.extract_vars.outputs.slack_thread_ts }}
          TARGET_REPO: ${{ steps.extract_vars.outputs.target_repo }}
          USER_PROMPT: ${{ steps.extract_vars.outputs.user_prompt }}
          MODEL_NAME: ${{ steps.extract_vars.outputs.model }}
          EFFORT_VAL: ${{ steps.extract_vars.outputs.effort }}
        run: |
          # Remove injected .agents and rule/skill files so they are NOT committed to the PR
          rm -rf .agents graphify-out
          git checkout -- .agents 2>/dev/null || true
          
          if [ -n "$(git status --porcelain)" ]; then
            TIMESTAMP=$(date +%s)
            BRANCH_NAME="ai-patch-${TIMESTAMP}"
            
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b $BRANCH_NAME
            git add .
            git commit -m "🤖 Antigravity AI Patch (${MODEL_NAME}): ${USER_PROMPT}"
            
            git push https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git $BRANCH_NAME
            
            PR_URL=$(gh pr create \
              --repo "$TARGET_REPO" \
              --head "$BRANCH_NAME" \
              --base "main" \
              --title "🤖 Antigravity AI Patch (${MODEL_NAME}): ${USER_PROMPT}" \
              --body "Automated PR generated by Google Antigravity Agent Engine.\n\nModel: \`${MODEL_NAME}\`\nReasoning Effort: \`${EFFORT_VAL}\`\nPrompt: ${USER_PROMPT}\n\n👀 Please review and merge when ready!")
            
            echo "PR created: $PR_URL"
            
            if [ -n "$SLACK_TOKEN" ] && [ -n "$SLACK_CHANNEL" ]; then
              curl -s -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer ${SLACK_TOKEN}" \
                -H "Content-Type: application/json" \
                -d json_payload=$(jq -n \
                  --arg chan "$SLACK_CHANNEL" \
                  --arg thread "$SLACK_THREAD" \
                  --arg pr "$PR_URL" \
                  --arg repo "$TARGET_REPO" \
                  --arg prompt "$USER_PROMPT" \
                  --arg model "$MODEL_NAME" \
                  --arg effort "$EFFORT_VAL" \
                  '{channel: $chan, thread_ts: $thread, text: ("🚀 *Pull Request Created & Ready for Review!*\n\n📦 *Repository:* `" + $repo + "`\n🧠 *Model:* `" + $model + "` (Effort: `" + $effort + "`)\n📌 *Prompt:* `" + $prompt + "`\n🔗 *PR Link:* <" + $pr + "|View Pull Request>\n\n👀 Please review and merge when ready!")}')
            fi
          else
            echo "No file changes were produced by the agent."
          fi
