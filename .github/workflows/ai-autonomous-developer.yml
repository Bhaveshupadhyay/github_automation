name: Antigravity Autonomous Developer (AGY Engine)

on:
  repository_dispatch:
    types: [ai_developer_task]
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target Repository (owner/repo)"
        required: false
      user_prompt:
        description: "User Prompt"
        required: false
      model:
        description: "AI Model (e.g. gemini-3.1-flash-lite)"
        required: false
        default: "gemini-3.1-flash-lite"
      effort:
        description: "Reasoning Effort (high, medium, low)"
        required: false
        default: "high"
      slack_channel:
        description: "Slack Channel ID"
        required: false
      slack_thread_ts:
        description: "Slack Thread Timestamp"
        required: false
  workflow_call:
    inputs:
      target_repo:
        type: string
        description: "Target Repository (owner/repo)"
        required: false
      user_prompt:
        type: string
        description: "User Prompt"
        required: false
      model:
        type: string
        description: "AI Model (e.g. gemini-3.1-flash-lite)"
        required: false
        default: "gemini-3.1-flash-lite"
      effort:
        type: string
        description: "Reasoning Effort (high, medium, low)"
        required: false
        default: "high"
      slack_channel:
        type: string
        description: "Slack Channel ID"
        required: false
      slack_thread_ts:
        type: string
        description: "Slack Thread Timestamp"
        required: false
    secrets:
      PAT_TOKEN:
        required: false
      SLACK_BOT_TOKEN:
        required: false
      AGY_AUTH_CONFIG:
        required: false
      AGY_SESSION_DATA:
        required: false
      AGY_API_KEY:
        required: false

jobs:
  run-agy-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4
        with:
          repository: bhaveshupadhyay/github_automation

      - name: Setup uv & Python Environment
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Project Dependencies via uv
        run: |
          uv sync
          uv pip install graphify-cli || pip install graphify-cli || true

      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.gemini/antigravity-cli/bin" >> $GITHUB_PATH
          echo "$HOME/.gemini/antigravity-cli" >> $GITHUB_PATH

      - name: Restore Antigravity Auth & Session Config
        env:
          AGY_AUTH_CONFIG: ${{ secrets.AGY_AUTH_CONFIG }}
          AGY_SESSION_DATA: ${{ secrets.AGY_SESSION_DATA }}
        run: |
          mkdir -p ~/.gemini/antigravity-cli ~/.gemini/config
          if [ -n "$AGY_SESSION_DATA" ]; then
            echo "$AGY_SESSION_DATA" | tr -d '\r\n ' | base64 -d > ~/.gemini/antigravity-cli/antigravity-oauth-token || true
          fi
          if [ -n "$AGY_AUTH_CONFIG" ]; then
            echo "$AGY_AUTH_CONFIG" | tr -d '\r\n ' | base64 -d > ~/.gemini/oauth_creds.json || true
          fi

      - name: Run Python Pre-Flight Target Resolution
        id: preflight
        env:
          USER_PROMPT: ${{ github.event.inputs.user_prompt || github.event.client_payload.user_prompt }}
          INPUT_TARGET: ${{ github.event.inputs.target_repo }}
          PAYLOAD_TARGET: ${{ github.event.client_payload.target_repo }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ github.event.inputs.slack_channel || github.event.client_payload.slack_channel }}
          SLACK_THREAD: ${{ github.event.inputs.slack_thread_ts || github.event.client_payload.slack_thread_ts }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          uv run python -m automation.preflight

      - name: Extract Workflow Variables
        id: extract_vars
        env:
          INPUT_PROMPT: ${{ github.event.inputs.user_prompt }}
          INPUT_MODEL: ${{ github.event.inputs.model }}
          INPUT_EFFORT: ${{ github.event.inputs.effort }}
          INPUT_SLACK_CHAN: ${{ github.event.inputs.slack_channel }}
          INPUT_SLACK_THREAD: ${{ github.event.inputs.slack_thread_ts }}
          PAYLOAD_PROMPT: ${{ github.event.client_payload.user_prompt }}
          PAYLOAD_MODEL: ${{ github.event.client_payload.model }}
          PAYLOAD_EFFORT: ${{ github.event.client_payload.effort }}
          PAYLOAD_SLACK_CHAN: ${{ github.event.client_payload.slack_channel }}
          PAYLOAD_SLACK_THREAD: ${{ github.event.client_payload.slack_thread_ts }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch_name }}
          RESOLVED_TARGET: ${{ steps.preflight.outputs.target_repo }}
        run: |
          PROMPT="$INPUT_PROMPT"
          if [ -z "$PROMPT" ]; then PROMPT="$PAYLOAD_PROMPT"; fi

          MODEL_NAME="$INPUT_MODEL"
          if [ -z "$MODEL_NAME" ]; then MODEL_NAME="$PAYLOAD_MODEL"; fi
          if [ -z "$MODEL_NAME" ]; then MODEL_NAME="gemini-3.1-flash-lite"; fi

          EFFORT_VAL="$INPUT_EFFORT"
          if [ -z "$EFFORT_VAL" ]; then EFFORT_VAL="$PAYLOAD_EFFORT"; fi
          if [ -z "$EFFORT_VAL" ]; then EFFORT_VAL="high"; fi

          SLACK_CHAN="$INPUT_SLACK_CHAN"
          if [ -z "$SLACK_CHAN" ]; then SLACK_CHAN="$PAYLOAD_SLACK_CHAN"; fi

          SLACK_THREAD="$INPUT_SLACK_THREAD"
          if [ -z "$SLACK_THREAD" ]; then SLACK_THREAD="$PAYLOAD_SLACK_THREAD"; fi

          echo "target_repo=$RESOLVED_TARGET" >> $GITHUB_OUTPUT
          {
            echo "user_prompt<<EOF"
            echo "$PROMPT"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "model=$MODEL_NAME" >> $GITHUB_OUTPUT
          echo "effort=$EFFORT_VAL" >> $GITHUB_OUTPUT
          echo "slack_channel=$SLACK_CHAN" >> $GITHUB_OUTPUT
          echo "slack_thread_ts=$SLACK_THREAD" >> $GITHUB_OUTPUT
          echo "existing_branch=$PAYLOAD_BRANCH" >> $GITHUB_OUTPUT

      - name: Clone Target Repository Workspace
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          TARGET_REPO="${{ steps.extract_vars.outputs.target_repo }}"
          if [ -n "$TARGET_REPO" ]; then
            echo "Cloning $TARGET_REPO..."
            git clone https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO}.git workspace_target
          else
            echo "⚠️ No target repository specified. Creating empty workspace directory for intent router clarification..."
            mkdir -p workspace_target
          fi

      - name: Run Master AI Orchestrator (Intent Router + Task Dispatcher)
        working-directory: workspace_target
        env:
          PYTHONPATH: ".."
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ steps.extract_vars.outputs.slack_channel }}
          SLACK_THREAD: ${{ steps.extract_vars.outputs.slack_thread_ts }}
          EXISTING_BRANCH: ${{ steps.extract_vars.outputs.existing_branch }}
          TARGET_REPO: ${{ steps.extract_vars.outputs.target_repo }}
          USER_PROMPT: ${{ steps.extract_vars.outputs.user_prompt }}
          MODEL_NAME: ${{ steps.extract_vars.outputs.model }}
          EFFORT_VAL: ${{ steps.extract_vars.outputs.effort }}
          GEMINI_API_KEY: ${{ secrets.AGY_API_KEY }}
          AGY_API_KEY: ${{ secrets.AGY_API_KEY }}
        run: |
          uv run --project .. python -m automation.main
